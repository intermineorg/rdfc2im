compile.dependencies = intermine/integrate/main

# The stock intermine-items-LARGE-xml-file loader, under our own type name.
#
# `have.large.file.xml.tgt` routes the retrieve phase through FullXmlConverterTask ->
# FullXmlConverter, which parses the items file with SAX and stores each <item> as it is read;
# the following load phase then moves the tgt-items database into production.
#
# The non-large `have.file.xml.tgt` looks simpler - XmlDataLoaderTask writes straight to
# production - but XmlDataLoader.processXml() calls XmlBinding.unmarshal(), which materialises
# the ENTIRE file as a List<FastPathObject> before storing anything.  That is fine for GO and
# fatal for a full UniProt or ncbi-gene extract.  Both routes use the same
# humanmine-items_keys.properties and the same genomic_priorities.properties, so this is a
# straight swap.  Set have.file.xml.tgt instead only for small one-off files.
have.large.file.xml.tgt = true
