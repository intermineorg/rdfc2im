# Hand-curated overrides applied by rdfc2im/project.py (_apply_priority_overrides) on top of
# genomic_priorities.properties' auto-generated ordering, after every regeneration - same role
# as extra_allow.txt / extensions_additions.xml, but for priority ORDER rather than model
# content. Add an entry here only when merge_priorities()'s "stock alongside source ranks
# first" default has been confirmed live to be wrong for that specific field - see
# _apply_priority_overrides's own docstring for why this can't be fixed generally.

# merge_priorities() ranks stock "reactome" first for every field humanmine-reactome writes,
# on the assumption HumanMine's own value should stand - correct for identifier/name/organism
# (reactome does provide those), wrong for description: ReactomeConverter.java never sets it
# (confirmed reading the converter and reactome_additions.xml - only identifier/name/shortName/
# curated are declared), so ranking it first silently starved every pathway reactome also
# touches of a description that only humanmine-reactome ever provides. Confirmed live before
# this override: 2344 of 2883 pathways (every one reactome's own UniProt2Reactome.txt also
# covers) had no description at all, while the other 539 (ours only) did.
Pathway.description = humanmine-reactome, reactome, *
