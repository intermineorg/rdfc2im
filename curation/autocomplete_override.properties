# Hand-curated additions/overrides merged into the mine's objectstoresummary.config.properties
# by rdfc2im (tools/reduce_mine.py objectstoresummary, applied AFTER the absent-class trim) -
# same role as priorities_override.properties / extra_allow.txt: a durable, reviewed change that
# survives regeneration. phase_prepare_mine_checkout re-copies the whole mine checkout from
# UPSTREAM_CACHE, so a hand-edit of the copied file would be silently lost on the next fresh run.
#
# A key here replaces the same key in the generated file, or is appended if absent. Values are
# space-separated field lists (upstream precedent: ProteinDomain.autocomplete = name shortName).

# Gene and Protein are the two classes this demo is actually about, and neither is in HumanMine's
# own upstream objectstoresummary.config.properties - this is an addition, not a restoration.
# Fields chosen against real row counts in the loaded mine, so nothing indexes an empty column:
# Gene.symbol 113/113, Gene.name 113/113, Gene.primaryIdentifier 113/113 (the NCBI id, what
# cross-source identifiers resolve to), Protein.primaryAccession 13546/13546,
# Protein.uniprotName 1501. Protein.name is deliberately left out: only 1066 of 13546 rows have
# one, so it would mostly contribute nothing while still costing index size on every build.
org.intermine.model.bio.Gene.autocomplete = symbol name primaryIdentifier
org.intermine.model.bio.Protein.autocomplete = primaryAccession uniprotName
