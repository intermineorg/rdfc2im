  # ======================= uniprot (UniProtConverter) =====================================
  - source: uniprot
    subject: UniProt
    pred: -self-
    im: Protein.primaryAccession
    status: sure
    basis: java:UniProtConverter
    transform: iri_localname
    required: "yes"
    note: the accession is the local name of the entry IRI (up:Q9BYF1); Protein.key_primaryacc
  - source: uniprot
    subject: UniProt
    pred: rdfs:label
    im: ""
    status: drop
    basis: spec-section-9
    note: the rdfs:label -> Protein trap named in the spec; the label is uniprot:ACC, not a name
  - source: uniprot
    pred: core:reviewed
    class: Protein
    im: ""
    status: drop
    basis: java:UniprotConverter
    note: >-
      Do NOT turn this into a reviewed=1 filter - the previous note suggested it, and its premise
      was false.  UniprotConverter defaults `loadtrembl = true` and HumanMine's project.xml does
      not override it, so stock loads TrEMBL as well as Swiss-Prot.  Checked 2026-09-16: RDF
      Portal has 20,431 reviewed and 190,278 unreviewed human entries, and live HumanMine holds
      117,219 human proteins - far more than Swiss-Prot alone.  A reviewed filter would drop
      ~83% of them.  There is no Protein field for the flag, so it is not loaded as data either.
  - source: uniprot
    pred: core:organism
    class: Protein
    im: Organism.taxonId
    status: sure
    basis: java:UniProtConverter
    transform: iri_localname
    value: taxonomy:9606
    required: "yes"
  - source: uniprot
    subject: RecommendedNameNode
    pred: core:fullName
    im: Protein.name
    status: sure
    basis: java:UniProtConverter
  - source: uniprot
    subject: RecommendedNameNode
    pred: core:shortName
    im: Synonym.value
    status: guess
    basis: knowledge
  - source: uniprot
    subject: RecommendedNameNode
    pred: core:ecName
    im: ECNumber.identifier
    status: guess
    basis: knowledge
    note: Protein.ecNumbers collection
  - source: uniprot
    subject: SubmittedNameNode
    pred: core:fullName
    im: Protein.name
    status: guess
    basis: knowledge
  - source: uniprot
    subject: AlternativeNameNode
    pred: core:fullName
    im: Synonym.value
    status: guess
    basis: knowledge
  - source: uniprot
    subject: AlternativeNameNode
    pred: core:shortName
    im: Synonym.value
    status: guess
    basis: knowledge
  - source: uniprot
    pred: core:replaces
    class: Protein
    im: Synonym.value
    status: guess
    basis: knowledge
    transform: iri_localname
    note: secondary accessions
  - source: uniprot
    pred: core:oldMnemonic
    class: Protein
    im: Synonym.value
    status: guess
    basis: knowledge
  - source: uniprot
    subject: Gene
    pred: skos:prefLabel
    im: Gene.symbol
    status: sure
    basis: term+java:UniProtConverter
    const: {Organism.taxonId: "9606"}
    const_via: {Organism.taxonId: Gene.organism}
    note: >-
      gene symbol - joins to HGNC/NCBI Gene via Gene.key_symbol_org (symbol, organism). The note
      already said "include Organism column in this table" but nothing did: sources.yaml's
      source-level consts attaches Organism.taxonId to the table's ROOT (Protein), not to this
      Gene sub-object reached via core:encodedBy, so every uniprot Gene item had no organism
      reference at all. Found only by an actual load: key_symbol_org (symbol, organismid) never
      matched the existing NULL-organism row against ncbigene's real one, so every panel gene got
      a second, bogus Gene row instead of merging - the same class of bug GWAS Catalog's own
      snp_gene_ids/mapped_genes rows already needed this same const_via fix for (b1a45fc).
  - source: uniprot
    subject: Gene
    pred: skos:altLabel
    im: ""
    status: todo
    basis: knowledge
    note: gene alias - would become a Synonym on the *Gene*, but the row's Synonym slot is used by protein synonyms; decide
  - source: uniprot
    subject: Gene
    pred: core:orfName
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:enzyme
    class: Protein
    im: ECNumber.identifier
    status: guess
    basis: knowledge
    transform: iri_localname
  - source: uniprot
    pred: core:existence
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:proteome
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:created
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:modified
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:version
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:isolatedFrom
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:potentialSequence
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:interaction
    class: Protein
    im: ""
    status: todo
    basis: spec-D6
    note: IntAct interactions - spec D6 (traditional psi load)
  - source: uniprot
    pred: core:annotation
    class: Protein
    im: ""
    status: drop
    basis: knowledge
    note: 70 annotation sub-node types; the UniProt converter loads Comment/UniProtFeature from them - a Phase 3 job
  - source: uniprot
    pred: core:component
    class: Protein
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    subject: UniProt
    pred: core:classifiedWith
    column: go
    im: ""
    status: todo
    basis: spec-D4
    transform: "iri_localname,replace:_:\\:"
    note: >-
      spec D4, and DO NOT simply re-enable this.  obo:GO_0001618 -> GO:0001618 is right, but there
      is no correct single-hop target.  Protein's only OntologyTerm collection is `keywords` (filled
      by uniprot-keywords), and binding GOTerm.identifier here sent GO terms into it - visibly wrong
      in the emitted items.  InterMine models GO as Annotatable.ontologyAnnotations -> GOAnnotation
      -> ontologyTerm -> GOTerm, i.e. an intermediate object that `via` cannot express today (it is
      one Class.field).  Either teach items.py to synthesise the intermediate, or leave this to the
      existing go-annotation source, which already loads protein GO annotations with evidence codes.
  - source: uniprot
    subject: UniProt
    pred: core:classifiedWith
    column: keyword
    im: OntologyTerm.identifier
    status: guess
    basis: knowledge
    transform: iri_localname
    note: keywords:NNN -> uniprot-keywords source stores identifier KW-NNNN; may need prefix:KW-
  - source: uniprot
    subject: Citation
    pred: foaf:primaryTopicOf
    im: Publication.pubMedId
    status: sure
    basis: java:UniProtConverter
    transform: iri_localname
  - source: uniprot
    subject: Citation
    pred: core:title
    im: Publication.title
    status: guess
    basis: knowledge
  - source: uniprot
    subject: DbResource
    pred: core:database
    im: DataSource.name
    status: guess
    basis: knowledge
    transform: iri_localname
    note: CrossReference.source -> DataSource
  - source: uniprot
    pred: rdfs:seeAlso
    class: Protein
    column: db_resource
    im: CrossReference.identifier
    status: guess
    basis: knowledge
    transform: iri_localname
  - source: uniprot
    subject: SimpleSequence
    pred: rdf:value
    im: ""
    status: drop
    basis: java:UniprotConverter
    note: >-
      Sequence.residues is a genuine term match, but uniprot loads alongside stock uniprot, which
      stores every residue string (UniprotConverter, "sequence" -> residues), and uniprot-fasta
      does too.  Sequence has no integration key, so ours never merge: Protein.sequence resolves
      to stock's by priority and ours are left as orphaned duplicates.  core:mass still loads -
      Protein.molecularWeight is an attribute and merges by priority.
  - source: uniprot
    subject: SimpleSequence
    pred: core:mass
    im: Protein.molecularWeight
    status: sure
    basis: term
  - source: uniprot
    subject: SimpleSequence
    pred: core:name
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:sequence
    class: Protein
    column: modified_sequence
    im: ""
    status: drop
    basis: knowledge
    note: isoform sequences - keep only the simple_sequence branch
  - source: uniprot
    pred: core:sequence
    class: Protein
    column: external_sequence
    im: ""
    status: drop
    basis: knowledge
  - source: uniprot
    pred: core:sequence
    class: Protein
    column: unknown_sequence
    im: ""
    status: drop
    basis: knowledge

  # ======================= reactome ======================================================
  - source: reactome
    subject: Pathway
    pred: biopax:displayName
    im: Pathway.name
    status: sure
    basis: java:ReactomeConverter
  - source: reactome
    subject: Pathway
    pred: biopax:name
    im: ""
    status: drop
    basis: knowledge
    note: multi-valued alternative names; displayName is the canonical one
  - source: reactome
    subject: Pathway
    pred: biopax:comment
    im: Pathway.description
    status: guess
    basis: knowledge
    filter: "regex:^(?!(Authored|Edited|Reviewed): )"
    note: >-
      The pathway summation.  Pathway.description is an approved section-8 extension
      (curation/extensions_additions.xml); this note used to say it was not.  biopax:comment is
      multi-valued: beside the summation each pathway carries curation provenance - across all
      human pathways (RDF Portal, 2026-09-17) 3,674 "Reviewed:", 2,955 "Authored:" and 2,809
      "Edited:" comments.  Unfiltered, every one became a candidate description and "first kept"
      chose by row order.  The filter excludes exactly those three prefixes, not any "Word:"
      prefix, because a few real summations start that way ("SPOP: ...", "APC: ...").  Filtered,
      2,883 pathways have 2,884 summations: one pathway genuinely has two, and keeps its first.
  - source: reactome
    subject: UnificationXref
    pred: biopax:id
    im: Pathway.identifier
    status: sure
    basis: java:ReactomeConverter
    filter: "regex:^R-HSA-"
    required: "yes"
    note: the stable id lives on the xref node; keep only Reactome (R-HSA) ids
  - source: reactome
    subject: OrganismXref
    pred: biopax:id
    im: Organism.taxonId
    status: sure
    basis: knowledge
    value: '"9606"'
    required: "yes"
    note: fixed to human; the Organism key
  - source: reactome
    subject: OrganismXref
    pred: biopax:db
    im: ""
    status: drop
    basis: knowledge
  - source: reactome
    subject: UnificationXref
    pred: biopax:db
    im: ""
    status: drop
    basis: knowledge
  - source: reactome
    subject: Organism
    pred: biopax:name
    im: Organism.name
    status: sure
    basis: java:ReactomeConverter
    note: Organism.name; the taxonId comes from the OrganismXref node
  - source: reactome
    subject: Pathway
    pred: biopax:pathwayComponent
    im: ""
    status: todo
    basis: spec-section-8
    note: reactions -> new PathwayReaction class (Phase 1 extension) or defer to Phase 2 BioPAX
  - source: reactome
    subject: Pathway
    pred: biopax:pathwayOrder
    im: ""
    status: drop
    basis: knowledge
  - source: reactome
    subject: Pathway
    pred: biopax:dataSource
    im: ""
    status: drop
    basis: knowledge
  - source: reactome
    subject: PublicationXref
    pred: biopax:id
    im: Publication.pubMedId
    status: guess
    basis: knowledge
    note: only rows whose pub_db is Pubmed are pubmed ids - filter by hand or add a VALUES on pub_db

  # ======================= gwas catalog (HugeGwasConverter) ==============================
  # ---- gwascatalog, first curation pass (CURATION_GUIDE 4.2).  HugeGwasConverter (huge-gwas,
  # which this source replaces) writes GWASResult.{SNP, associatedGenes, phenotype, pValue, study,
  # associatedVariantRiskAllele, riskAlleleFreqInControls}, GWAS.{firstAuthor, year, name,
  # initialSample, replicateSample, publication}, and bare SNP/Gene/Publication identifiers.
  # Column indices below are the GWAS Catalog associations file the converter reads.

  # Not written by the converter; no field on GWASResult/GWAS/SNP.
  - {source: gwascatalog, pred: "terms:region", column: region, im: "", status: drop, basis: java:HugeGwasConverter, note: "cytogenetic region (line[10]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:chr_id", column: chr_id, im: "", status: drop, basis: java:HugeGwasConverter, note: "chromosome (line[11]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:chr_pos", column: chr_pos, im: "", status: drop, basis: java:HugeGwasConverter, note: "position (line[12]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:upstream_gene_id", column: upstream_gene_id, im: "", status: drop, basis: java:HugeGwasConverter, note: "upstream gene (line[15]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:downstream_gene_id", column: downstream_gene_id, im: "", status: drop, basis: java:HugeGwasConverter, note: "downstream gene (line[16]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:upstream_gene_distance", column: upstream_gene_distance, im: "", status: drop, basis: java:HugeGwasConverter, note: "upstream distance (line[18]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:downstream_gene_distance", column: downstream_gene_distance, im: "", status: drop, basis: java:HugeGwasConverter, note: "downstream distance (line[19]); the converter never writes it"}
  - {source: gwascatalog, pred: "rdfs:seeAlso", column: see_also, im: "", status: drop, basis: java:HugeGwasConverter, note: "dbSNP link; SNP.primaryIdentifier already comes from terms:snps; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:merged", column: merged_, im: "", status: drop, basis: java:HugeGwasConverter, note: "dbSNP merge flag (line[22]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:snp_id_current", column: snp_id_current, im: "", status: drop, basis: java:HugeGwasConverter, note: "current dbSNP id (line[23]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:context", column: context, im: "", status: drop, basis: java:HugeGwasConverter, note: "variant consequence (line[24]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:intergenic", column: inetergenic, im: "", status: drop, basis: java:HugeGwasConverter, note: "intergenic flag (line[25]); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:p_value_mlog", column: p_value_mlog, im: "", status: drop, basis: java:HugeGwasConverter, note: "-log10 p (derived; pValue is mapped); the converter never writes it"}
  - {source: gwascatalog, pred: "terms:p_value_text", column: p_value_text, im: "", status: drop, basis: java:HugeGwasConverter, note: "p-value qualifier text; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:odds_ratio", column: odds_ratio, im: "", status: drop, basis: java:HugeGwasConverter, note: "odds ratio; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:beta", column: beta, im: "", status: drop, basis: java:HugeGwasConverter, note: "beta; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:beta_unit", column: beta_unit, im: "", status: drop, basis: java:HugeGwasConverter, note: "beta unit; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:ci_text", column: ci_text, im: "", status: drop, basis: java:HugeGwasConverter, note: "confidence interval; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:platform_snp_passing_qc", column: platform_snp_passing_qc, im: "", status: drop, basis: java:HugeGwasConverter, note: "platform / SNPs passing QC; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:cnv", column: cnv, im: "", status: drop, basis: java:HugeGwasConverter, note: "CNV flag; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:genotyping_technology", column: genotyping_technology_assoc, im: "", status: drop, basis: java:HugeGwasConverter, note: "genotyping technology; the converter never writes it"}
  - {source: gwascatalog, pred: "dct:date", column: date, im: "", status: drop, basis: java:HugeGwasConverter, note: "association date; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:platform_snps_passing_qc", column: platform_snps_passing_qc, im: "", status: drop, basis: java:HugeGwasConverter, note: "platform / SNPs passing QC; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:genotyping_technology", column: genotyping_technology_study, im: "", status: drop, basis: java:HugeGwasConverter, note: "genotyping technology; the converter never writes it"}
  - {source: gwascatalog, pred: "terms:association_count", column: association_count, im: "", status: drop, basis: java:HugeGwasConverter, note: "association count; the converter never writes it"}

  # Duplicates of rows already mapped.
  - {source: gwascatalog, pred: "dct:references", column: refpubmed, im: "", status: drop, basis: knowledge, note: "same PubMed id as gwas:has_pubmed_id on GWASStudy, already Publication.pubMedId"}
  - {source: gwascatalog, pred: "gwas:has_pubmed_id", column: has_pubmed_id_association, im: "", status: drop, basis: knowledge, note: "association-level copy of the study PubMed id, already Publication.pubMedId"}
  - {source: gwascatalog, pred: "dct:references", column: study_references, im: "", status: drop, basis: knowledge, note: "pubmed:NNN form of the study PubMed id, already Publication.pubMedId"}
  - {source: gwascatalog, pred: "terms:mapped_trait", column: mapped_trait, im: "", status: drop, basis: knowledge, note: "study-level trait; the association-level mapped_trait_uri is already GWASResult.mappedTraitUri"}

  # Genuine decisions.
  - {source: gwascatalog, pred: "terms:snp_gene_ids", column: snp_gene_ids, im: "Gene.secondaryIdentifier", status: sure, basis: "java:HugeGwasConverter+model:Gene", transform: iri_localname, const: {Organism.taxonId: "9606"}, const_via: {Organism.taxonId: Gene.organism}, note: "The only populated gene source: 442,992 Ensembl IRIs over 397,141 associations on TogoVar (checked 2026-09-17), while terms:mapped_genes is empty on all 686,504. HugeGwasConverter also takes associatedGenes from this column (SNP_GENE_IDS, line[17]) but writes the Ensembl id to Gene.primaryIdentifier, which clashes with HumanMine's NCBI keys; HumanMine keeps Ensembl ids in Gene.secondaryIdentifier and merges them on key_secondaryidentifier_org, so this writes there, with the organism the key requires. Stays in main: GWASResult has no identifier, so a satellite table could not say which result a gene belongs to"}
  - {source: gwascatalog, pred: "dct:description", column: study_description, im: "", status: todo, basis: spec-D12, note: "spec D12: the converter's GWAS.name is the study title (line[6]), which is this; this source maps the GCST id (dct:identifier) to GWAS.name instead"}

  - source: gwascatalog
    pred: terms:p_value
    class: GWASResult
    im: GWASResult.pValue
    status: sure
    basis: java:HugeGwasConverter
  - source: gwascatalog
    pred: terms:risk_allele_frequency
    class: GWASResult
    im: GWASResult.riskAlleleFreqInControls
    status: sure
    basis: java:HugeGwasConverter
  - source: gwascatalog
    pred: terms:strongest_snp_risk_allele
    class: GWASResult
    im: GWASResult.associatedVariantRiskAllele
    status: sure
    basis: java:HugeGwasConverter
  - source: gwascatalog
    pred: terms:mapped_trait
    class: GWASResult
    im: GWASResult.phenotype
    status: sure
    basis: java:HugeGwasConverter
  - source: gwascatalog
