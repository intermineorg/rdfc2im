    im: ""
    status: drop
    basis: java:OboParser
    note: "term_replaced_by: OboParser never reads `replaced_by`; obsoleteness itself is already loaded as OntologyTerm.obsolete"
  # Authoring provenance.  OboParser reads none of these tags and OntologyTerm has no field for
  # any of them, so stock HumanMine has never loaded them.
  - pred: oboinowl:created_by
