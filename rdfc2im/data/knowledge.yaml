  - source: pubmed
    pred: bibo:volume
    class: Publication
    im: Publication.volume
    status: sure
    basis: term
  - source: pubmed
    pred: foaf:LastName
    class: Author
    im: Author.lastName
    status: sure
    basis: knowledge
  - source: pubmed
    pred: foaf:firstName
    class: Author
    im: Author.firstName
    status: sure
