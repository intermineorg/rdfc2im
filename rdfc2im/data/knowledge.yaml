  - {source: clinvar, pred: "rdfs:label", column: exact_position_bnode_label, im: "", status: drop, basis: spec-D13, note: "the label of the variant LOCATION blank node (e.g. 12:51864290:GRCh37), flattened onto Allele and matched to Allele.name by term; it overwrote the real variant name, one per assembly. Coordinates are D13"}
  - {source: clinvar, pred: "faldo:position", column: position, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "faldo:position", column: gene_begin, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "faldo:position", column: gene_end, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:accession", column: refseq, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:accession", column: chromosome_accession, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly", column: assembly, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly", column: gene_assembly, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly_accession_version", column: assembly_accession_version, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly_accession_version", column: gene_assembly_accession, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly_status", column: assembly_status, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:assembly_status", column: gene_assembly_status, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:chr", column: chromosome, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:chr", column: gene_chromosome, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:variant_length", column: variant_length, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:strand", column: gene_strand, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:canonical_spdi", column: spdi, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}
  - {source: clinvar, pred: "cvo:cytogenetic_location", column: variant_location, im: "", status: todo, basis: spec-D13, note: "spec D13 - the stock converter loads no coordinates, so dropping matches HumanMine today; open only if we extend beyond stock"}

  # Disease identifiers - spec D5, still open (MedGen here, OMIM in the converter).
  - {source: clinvar, pred: "dct:identifier", column: disease_id, im: "", status: todo, basis: spec-D5, note: "spec D5 - ClinVar gives MedGen; the converter parses OMIM out of line[12] for Disease.primaryIdentifier"}
  - {source: clinvar, pred: "dct:references", column: disease_reference, im: "", status: todo, basis: spec-D5, note: "spec D5 - ClinVar gives MedGen; the converter parses OMIM out of line[12] for Disease.primaryIdentifier"}
  - {source: clinvar, pred: "dct:source", column: disease_source, im: "", status: todo, basis: spec-D5, note: "spec D5 - ClinVar gives MedGen; the converter parses OMIM out of line[12] for Disease.primaryIdentifier"}

  # Other identifiers - part of the AlleleID/VCV decision on cvo:accession above.
  - {source: clinvar, pred: "cvo:variation_id", column: id, im: "", status: todo, basis: knowledge, note: "ClinVar VariationID, the number inside the VCV accession; redundant with it unless keying changes - see cvo:accession"}

  - source: clinvar
    pred: cvo:variation_name
    class: Allele
    im: ""
    status: drop
    basis: knowledge
    note: >-
      Identical to rdfs:label in every fetched row, and both wrote Allele.name on the same object.
      Of the two, rdfs:label keeps the mapping because its evidence is real (it is the model term
      of BioEntity.name); this entry claimed basis java:ClinvarConverter, which is false - the
      converter never writes Allele.name.
  - source: clinvar
    pred: cvo:variation_type
    class: Allele
    im: Allele.type
    status: sure
    basis: java:ClinvarConverter
  - source: clinvar
    pred: cvo:description
    class: Allele
    column: interpretation
    im: Allele.clinicalSignificance
    status: sure
    basis: java:ClinvarConverter
  - source: clinvar
    pred: cvo:review_status
    class: Allele
    im: Allele.reviewStatus
    status: guess
    basis: spec-section-8
  - source: clinvar
    pred: cvo:submission_count
    class: Allele
    im: Allele.submissionCount
    status: guess
    basis: spec-section-8
  - source: clinvar
    pred: med2rdf:reference_allele
    class: Allele
    im: Allele.reference
    status: sure
    basis: java:ClinvarConverter
  - source: clinvar
    pred: med2rdf:alternative_allele
    class: Allele
    im: Allele.alternate
    status: sure
    basis: java:ClinvarConverter
  - source: clinvar
    pred: cvo:gene_id
    class: Gene
    im: Gene.primaryIdentifier
    status: sure
    basis: java:ClinvarConverter
    const: {Organism.taxonId: "9606"}
    const_via: {Organism.taxonId: Gene.organism}
    note: >-
      sources.yaml's source-level consts attaches Organism.taxonId to clinvar's table root
      (Allele) only - the Gene sub-object reached via med2rdf:gene would otherwise get no
      organism reference at all, and Gene.key_symbol_org/key_secondaryidentifier_org would never
      match an existing NULL-organism row against ncbigene's real one. Same class of bug found
      loading uniprot (a67ce39) and GWAS Catalog before it (b1a45fc); fixed here proactively,
      before ever loading clinvar, rather than after finding it the same way a third time.
  - source: clinvar
    pred: cvo:symbol
    class: Gene
    im: Gene.symbol
    status: sure
    basis: java:ClinvarConverter
  - source: clinvar
    pred: dct:identifier
    class: Disease
    im: Disease.primaryIdentifier
    status: todo
