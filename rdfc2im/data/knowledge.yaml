  # ======================= ontologies (obo / oboInOwl) - all *Term classes ================
  - pred: -self-
    class: OntologyTerm
    im: ""
    status: drop
    basis: knowledge
    note: oboinowl:id carries the identifier; the IRI is redundant
  - pred: oboinowl:id
    class: OntologyTerm
    im: OntologyTerm.identifier
    status: sure
    basis: java:OboConverter
    required: "yes"
    filter: "regex:^[A-Za-z][A-Za-z0-9]*:[0-9]+$"
    note: >-
      e.g. GO:0044255 - exactly what the obo source stores in identifier.  The filter is not
      cosmetic: OBO ontologies give oboinowl:id to OWL object and annotation properties as well
      as to classes, so a full GO extract yields 11 rows whose "identifier" is a relationship
      name - part_of, occurs_in, regulates, ends_during, happens_during, starts_during, has_part,
      positively_regulates, negatively_regulates, has_ontology_root_term, term_tracker_item.
      They loaded as GOTerms and sorted to the top of the class in the UI.  Requiring the
      PREFIX:digits shape keeps every real term (GO:, HP:, MP:, UBERON:) and drops these; the
      column is required=yes, so a failing row is dropped rather than blanked.
  - pred: skos:notation
    class: OntologyTerm
    im: OntologyTerm.identifier
    status: drop
    basis: knowledge
    note: duplicates oboinowl:id
  - pred: rdfs:label
    class: OntologyTerm
    im: OntologyTerm.name
    status: sure
    basis: term
  - pred: obo:IAO_0000115
    class: OntologyTerm
    im: OntologyTerm.description
    status: sure
    basis: java:OboConverter
    note: IAO_0000115 = "definition"; obo source stores the def in description
  - pred: oboinowl:hasOBONamespace
    class: OntologyTerm
    im: OntologyTerm.namespace
    status: sure
    basis: java:OboConverter
  - pred: oboinowl:hasExactSynonym
    class: OntologyTerm
    im: OntologyTermSynonym.name
    status: sure
    basis: java:OboConverter
    const: {OntologyTermSynonym.type: exact}
    note: obo source stores each synonym with its scope in OntologyTermSynonym.type
  - pred: oboinowl:hasRelatedSynonym
    class: OntologyTerm
    im: OntologyTermSynonym.name
    status: sure
    basis: java:OboConverter
    const: {OntologyTermSynonym.type: related}
  - pred: oboinowl:hasBroadSynonym
    class: OntologyTerm
    im: OntologyTermSynonym.name
    status: sure
    basis: java:OboConverter
    const: {OntologyTermSynonym.type: broad}
  - pred: oboinowl:hasNarrowSynonym
    class: OntologyTerm
    im: OntologyTermSynonym.name
    status: sure
    basis: java:OboConverter
    const: {OntologyTermSynonym.type: narrow}
  - pred: oboinowl:hasDbXref
    class: OntologyTerm
    im: OntologyTerm.crossReferences
    status: sure
    basis: java:OboConverter
    note: >-
      Exactly what stock HumanMine loads: OboParser reads `xref`, and OboConverter.createXref
      builds an OntologyTerm with that identifier and adds it to crossReferences.  The collection
      holds OntologyTerm, not CrossReference, so xref ids like Reactome:REACT_28392 become
      identifier-only OntologyTerms - that is the stock behaviour this replaces, not a side effect.
  - pred: oboinowl:hasAlternativeId
    class: OntologyTerm
    im: OntologyTermSynonym.name
    status: sure
    basis: java:OboParser
    const: {OntologyTermSynonym.type: alt_id}
    note: >-
      OboParser loads each alt_id twice - addSynonyms(term, altIds, "alt_id") and
      addXrefs(term, altIds).  This maps the synonym, which is how a secondary id becomes
      searchable; the duplicate xref is not reproduced (one predicate maps to one field).
  - pred: oboinowl:inSubset
    class: OntologyTerm
    im: ""
    status: todo
    basis: spec-D2
    note: >-
      spec D2 - still open, but narrower than it looks: OboParser never reads `subset`, so stock
      HumanMine has never loaded GO-slim membership and dropping this changes nothing.  The only
      real question is whether to go *beyond* stock by extending the model.
  - pred: rdfs:subClassOf
    class: OntologyTerm
    im: OntologyTerm.parents
    status: guess
    basis: java:OboConverter
    filter: "regex:^https?://purl\\.obolibrary\\.org/obo/"
    transform: "iri_localname,replace:_:\\:"
    note: >-
      is_a parents (obo source fills OntologyTerm.parents).  The filter runs on the raw term,
      before the transform, and is not optional: in OWL, rdfs:subClassOf also points at anonymous
      class expressions (owl:Restriction, "part_of some X").  A full GO extract returns 92,208
      superclass rows of which 16,178 are blank nodes and 3 are owl:Thing; without the filter
      iri_localname turned each blank node into a GOTerm whose identifier was its node id, adding
      16k junk parents.  Restricting to the OBO namespace keeps legitimate cross-ontology parents
      (BFO, CARO), which still arrive as identifier-only stub items - filter harder if unwanted.
  - pred: rdfs:comment
    class: OntologyTerm
    im: ""
    status: drop
    basis: java:OboParser
    note: "OboParser never reads `comment`, and OntologyTerm has no field for it (description holds the definition)"
  - pred: owl:deprecated
    class: OntologyTerm
    im: OntologyTerm.obsolete
    status: guess
    basis: knowledge
  - pred: obo:IAO_0100001
