  # Global minor allele frequency: not loaded by the converter; no Allele field.
  - {source: clinvar, pred: "cvo:minor_allele", column: minor_allele, im: "", status: drop, basis: java:ClinvarConverter, note: "minor allele; the converter never loads allele frequency"}
  - {source: clinvar, pred: "cvo:value", column: frequency, im: "", status: drop, basis: java:ClinvarConverter, note: "MAF value; the converter never loads allele frequency"}
  - {source: clinvar, pred: "cvo:source", column: frequency_source, im: "", status: drop, basis: java:ClinvarConverter, note: "MAF source; the converter never loads allele frequency"}

  # Gene attributes seen from ClinVar.  The converter writes only Gene.primaryIdentifier; name,
  # cytoLocation and xrefs belong to ncbi-gene and hgnc, and loading them here too would only
  # create priority conflicts.
  - {source: clinvar, pred: "cvo:cytogenetic_location", column: gene_location, im: "", status: drop, basis: java:ClinvarConverter, note: "gene cytoLocation; the converter writes only Gene.primaryIdentifier, ncbi-gene/hgnc own this"}
  - {source: clinvar, pred: "cvo:full_name", column: gene_name, im: "", status: drop, basis: java:ClinvarConverter, note: "gene name; the converter writes only Gene.primaryIdentifier, ncbi-gene/hgnc own this"}
