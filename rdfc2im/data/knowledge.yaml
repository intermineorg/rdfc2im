  # ======================= mesh / ensembl ================================================
  - source: mesh
    subject: Descriptor
    pred: rdfs:label
    im: MeshTerm.name
    status: sure
    basis: knowledge
    note: MeshTerm.name is the descriptor label (update-publications loads the same)
  - source: mesh
    subject: Descriptor
    pred: meshv:identifier
    im: MeshTerm.identifier
    status: guess
    basis: knowledge
    required: "yes"
    note: new field (curation/extensions_additions.xml); pubmed fabio:hasSubjectTerm supplies the same D-ids
  - source: mesh
    subject: Descriptor
    pred: meshv:broaderDescriptor
    im: ""
    status: todo
    basis: knowledge
    note: MeshTerm has no parents collection; drop or extend the model
  - source: mesh
    pred: meshv:dateCreated
    im: ""
    status: drop
    basis: knowledge
  - source: mesh
    pred: meshv:dateEstablished
    im: ""
    status: drop
    basis: knowledge
  - source: mesh
    pred: meshv:dateRevised
    im: ""
    status: drop
    basis: knowledge
  - source: ensembl
    subject: EnsemblGene
    pred: dcterms:identifier
    im: Gene.secondaryIdentifier
    status: sure
    basis: java:NcbiGeneConverter
    required: "yes"
    note: Ensembl ids are Gene.secondaryIdentifier in HumanMine (ncbi-gene/hgnc); Gene.key_secondaryidentifier_org merges on it
  - source: ensembl
    subject: EnsemblGene
    pred: "-self-"
    im: ""
    status: drop
    basis: knowledge
    note: >-
      The generic self-row fallback guesses a class's key attribute from the subject IRI's own
      local name when no predicate carries it - reasonable when the IRI itself is the source's
      declared key, wrong here: EnsemblGene's IRI local name is the same Ensembl id the row
      above already correctly maps to Gene.secondaryIdentifier, and the fallback guessed it a
      second time onto Gene.primaryIdentifier, which is always NCBI's Entrez id in HumanMine,
      never Ensembl's. Found only by an actual load, not by reading: two Gene rows for the same
      real gene - one with a real NCBI primaryIdentifier, one self-keyed on its own Ensembl id -
      both carry the same symbol+organism, so InterMine's loader refuses with "Duplicate objects
      found for pk Gene.key_symbol_org" the moment ensembl is integrated for the first time.
  - source: ensembl
    subject: EnsemblGene
    pred: obo:RO_0002162
    im: Organism.taxonId
    status: sure
    basis: data:rdfportal
    transform: iri_localname
    value: "taxonomy:9606"
    required: "yes"
    note: >-
      Confirmed live against https://rdfportal.org/ebi/sparql (dataset ensembl, 2026-09-17):
      10354911 EnsemblGene records across 348 species, of which only 87693 (0.85%) are
      taxonomy:9606 (Homo_sapiens). Without this, ensg_taxonomy was an unfiltered OPTIONAL
      column while sources.yaml's Organism.taxonId const=9606 applied unconditionally to every
      row regardless of species - fetching would pull ~10.35M non-human rows and mislabel every
      one of them as human. Required+filtered here the same way ncbigene's ncbio:taxid is.
  - source: ensembl
    subject: EnsemblGene
    pred: rdfs:label
    im: Gene.symbol
    status: sure
    basis: knowledge
  - source: ensembl
    subject: EnsemblGene
    pred: dcterms:description
    im: Gene.description
    status: sure
    basis: term
    note: "Ensembl descriptions carry a [Source:HGNC ...] suffix; a regex transform can strip it"
    transform: "regex:^(.*?)\\s*\\[Source:"
  - source: ensembl
    subject: EnsemblGene
    pred: terms:has_biotype
    im: Gene.typeOfGene
    status: guess
    basis: spec-section-8
    transform: iri_localname
    note: ENSGLOSSARY ids; a lookup to the biotype label would be nicer
  - source: ensembl
    subject: EnsemblGene
    pred: so:part_of
    im: Chromosome.primaryIdentifier
    status: guess
    basis: knowledge
    transform: iri_localname
    filter: "regex:.*/(?:[1-9]|1[0-9]|2[0-2]|X|Y|MT)$"
    note: >-
      so:part_of is multi-valued and not chromosome-specific: a gene is part_of both its actual
      chromosome (.../110/homo_sapiens/GRCh38/1) and the assembly it belongs to
      (.../110/homo_sapiens/GRCh38), same predicate, different granularity. Without the filter,
      the assembly row's iri_localname is "GRCh38" itself, which loaded as if it were a
      Chromosome - found only by an actual load: Gene.chromosome conflicted between
      humanmine-ncbigene's real "1" and humanmine-ensembl's "GRCh38" for the same gene, with no
      genomic_priorities.properties entry able to make that a sane choice, because it never
      should have been a candidate value at all. The filter runs on the raw IRI before
      iri_localname, requiring it end in an actual human chromosome name (1-22, X, Y, MT).
  - source: ensembl
    subject: EnsemblGene
    pred: skos:altLabel
    im: Synonym.value
    status: guess
    basis: knowledge
  - source: ensembl
    subject: EnsemblGene
    pred: rdfs:seeAlso
    im: CrossReference.identifier
    status: guess
    basis: knowledge
    transform: iri_localname
  - source: ensembl
    subject: EnsemblTranscript
    pred: dcterms:identifier
    im: Transcript.primaryIdentifier
    status: sure
    basis: knowledge
  - source: ensembl
    subject: EnsemblTranscript
    pred: rdfs:label
    im: Transcript.name
    status: guess
    basis: knowledge
  - source: ensembl
    subject: EnsemblTranscript
    pred: so:transcribed_from
    im: Transcript.gene
    status: sure
    basis: knowledge
    note: Transcript.gene reference -> Gene.secondaryIdentifier of the EnsemblGene node
  - source: ensembl
    subject: EnsemblProtein
    pred: dcterms:identifier
    im: ""
    status: todo
    basis: knowledge
    note: ENSP - not a UniProt accession; decide
  - source: ensembl
    pred: faldo:position
    im: ""
    status: todo
    basis: knowledge
    note: begin/end -> Location.start/end via Gene.chromosomeLocation is possible with Items XML; needs Location.locatedOn=Chromosome too - decide

  # ======================= generic (any source, by class) ================================
  - pred: dct:identifier
    class: Publication
    im: Publication.pubMedId
    status: guess
    basis: knowledge
  - pred: dct:title
    class: Publication
    im: Publication.title
    status: sure
    basis: term
  - pred: bibo:abstract
    class: Publication
    im: Publication.abstractText
    status: sure
    basis: term
  - pred: dct:identifier
    class: Gene
    im: Gene.primaryIdentifier
    status: guess
    basis: knowledge
  - pred: dct:identifier
    class: Protein
    im: Protein.primaryAccession
    status: guess
    basis: knowledge
  - pred: dct:identifier
    class: Pathway
    im: Pathway.identifier
    status: sure
    basis: term
  - pred: dct:identifier
    class: OntologyTerm
    im: OntologyTerm.identifier
    status: guess
    basis: knowledge
  - pred: rdfs:label
    class: Gene
    im: Gene.symbol
    status: guess
    basis: knowledge
    note: in gene sources rdfs:label is nearly always the symbol; the term index would say name
  - pred: skos:prefLabel
    class: Gene
    im: Gene.symbol
    status: sure
    basis: term
  - pred: skos:altLabel
    class: BioEntity
    im: Synonym.value
    status: guess
    basis: knowledge
  - pred: dct:description
    class: Gene
    im: Gene.description
    status: guess
    basis: knowledge
  - pred: obo:RO_0002162
    class: BioEntity
    im: Organism.taxonId
    status: sure
    basis: knowledge
    transform: iri_localname
    note: RO_0002162 = "in taxon"
  - pred: dct:modified
    im: ""
    status: drop
    basis: knowledge
  - pred: dct:created
    im: ""
    status: drop
    basis: knowledge
