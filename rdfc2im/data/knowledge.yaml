# rdfc2im knowledge table
#
# Everything the translator "knows" beyond the term-URI join lives here, so it can be
# reviewed as data.  Two sections:
#
#   subjects:   rdf-config subject -> InterMine class
#   predicates: rdf-config predicate (in the context of a bound class) -> InterMine attribute
#
# Each entry carries the *status* the translator will emit for a row it produces:
#   sure   - backed by uploaded evidence: a Java converter of the original HumanMine source,
#            an obo.term.class setting, a keys file, or a one-to-one field name.
#   guess  - my proposal from general knowledge of the vocabulary; please confirm.
# and a *basis* string that says where it came from (java:<Converter>, props:<file>, knowledge).
#
# Matching:  `type`/`pred` are CURIEs expanded with the prefixes below (or full IRIs).
#            `class` restricts a predicate entry to subjects bound to that class or a subclass.
#            `source` restricts an entry to one rdf-config source directory name.
#            `im` is the attribute to write, "Class.field".  If the class differs from the
#            subject's class (e.g. Synonym.value on a Gene subject) the row's `via` records the
#            link field that connects them (Gene.synonyms).
#            `transform` is applied by `rdfc2im tsv` when cleaning the fetched TSV.
#            `table` forces the row into a named table (default: derived from cardinality).
#            `value` fixes the variable to a constant in the query (VALUES clause).
#
# Precedence when several rules could fire on one row:
#   source-specific `sure` entry > term-URI match > generic knowledge entry > exact name match.

prefixes:
  rdf:      http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs:     http://www.w3.org/2000/01/rdf-schema#
  owl:      http://www.w3.org/2002/07/owl#
  skos:     http://www.w3.org/2004/02/skos/core#
  dct:      http://purl.org/dc/terms/
  dc:       http://purl.org/dc/elements/1.1/
  obo:      http://purl.obolibrary.org/obo/
  oboinowl: http://www.geneontology.org/formats/oboInOwl#
  sio:      http://semanticscience.org/resource/
  foaf:     http://xmlns.com/foaf/0.1/
  bibo:     http://purl.org/ontology/bibo/
  prism:    http://prismstandard.org/namespaces/basic/3.0/
  fabio:    http://purl.org/spar/fabio/
  core:     http://purl.uniprot.org/core/
  insdc:    http://ddbj.nig.ac.jp/ontologies/nucleotide/
  ncbio:    http://ncbi.nlm.nih.gov/gene/ontology#
  biopax:   http://www.biopax.org/release/biopax-level3.owl#
  orth:     http://purl.org/net/orth#
  gwas:     http://rdf.ebi.ac.uk/terms/gwas/
  terms:    http://rdf.ebi.ac.uk/terms/gwas/
  cvo:      http://purl.jp/bio/10/clinvar/
  med2rdf:  http://med2rdf.org/ontology/med2rdf#
  m2r:      http://med2rdf.org/ontology/med2rdf#
  idt:      http://identifiers.org/
  faldo:    http://biohackathon.org/resource/faldo#
  meshv:    http://id.nlm.nih.gov/mesh/vocab#
  so:       http://purl.obolibrary.org/obo/so#
  dcterms:  http://purl.org/dc/terms/

# ----------------------------------------------------------------------------- subjects
subjects:
  # --- gene identity (project.xml runs ncbi-gene + hgnc; NcbiGeneConverter/HgncConverter) ---
  - type: insdc:Gene
    im_class: Gene
    status: sure
    basis: knowledge+java:NcbiGeneConverter
    note: ncbigene Gene subject; NcbiGeneConverter creates one Gene per record
  - source: hgnc
    subject: HGNC
    im_class: Gene
    status: sure
    basis: java:HgncConverter
    note: HgncConverter creates a Gene keyed by the NCBI Gene id (line[18]); rows without it are skipped
  - source: hgnc
    subject: NCBIGene
    im_class: Gene
    status: sure
    basis: java:HgncConverter
    note: identifiers.org/ncbigene node - its dct:identifier is Gene.primaryIdentifier
  - source: hgnc
    subject: Ensembl
    im_class: Gene
    status: sure
    basis: java:HgncConverter
    note: identifiers.org/ensembl node - its dct:identifier is Gene.secondaryIdentifier (same Gene object in the row)
  - source: hgnc
    subject: PubMed
    im_class: Publication
    status: sure
    basis: knowledge
  - source: hgnc
    subject: UniProt
    im_class: Protein
    status: guess
    basis: knowledge
    note: identifiers.org/uniprot node -> Protein.primaryAccession, links Gene.proteins by co-occurrence
  - source: hgnc
    subject: OMIM
    im_class: Disease
    status: guess
    basis: knowledge
    note: OMIM id -> Disease.primaryIdentifier as "OMIM:<id>" (clinvar/hpo-annotation key OMIM this way)

  # hgnc identifiers.org nodes that NcbiGeneConverter would load as CrossReference (createCrossReference for every dbXref)
  - source: hgnc
    subject: ENA
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=ENA (CrossReference.source)
  - source: hgnc
    subject: INSDC
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=INSDC (CrossReference.source)
  - source: hgnc
    subject: RefSeq
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=RefSeq (CrossReference.source)
  - source: hgnc
    subject: CCDS
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=CCDS (CrossReference.source)
  - source: hgnc
    subject: MGI
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=MGI (CrossReference.source)
  - source: hgnc
    subject: RGD
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=RGD (CrossReference.source)
  - source: hgnc
    subject: LRG
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=LRG (CrossReference.source)
  - source: hgnc
    subject: MiRBase
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=miRBase (CrossReference.source)
  - source: hgnc
    subject: EC
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=Enzyme Nomenclature (CrossReference.source)
  - source: hgnc
    subject: Orphanet
    im_class: CrossReference
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    note: xref id -> CrossReference.identifier with DataSource.name=Orphanet (CrossReference.source)
  # --- ontologies: obo.term.class from each source's .properties ---
  - source: go
    subject: Class
    im_class: GOTerm
    status: sure
    basis: props:go.properties obo.term.class=GOTerm
  - source: hpo
    subject: Class
    im_class: HPOTerm
    status: sure
    basis: props:hpo.properties obo.term.class=HPOTerm
  - source: mp
    subject: Class
    im_class: MammalianPhenotypeTerm
    status: sure
    basis: props:mammalian-phenotype-ontology.properties obo.term.class=MammalianPhenotypeTerm
  - source: uberon
    subject: Class
    im_class: AnatomyTerm
    status: sure
    basis: props:uberon.properties obo.term.class=AnatomyTerm (needs /uberon/ in the allow list)
  # --- uniprot ---
  - type: core:Protein
    im_class: Protein
    status: sure
    basis: term
  - type: core:Gene
    im_class: Gene
    status: sure
    basis: knowledge+java:UniProtConverter
    note: UniProt gene node; skos:prefLabel is the gene symbol used to link Protein->Gene
  - source: uniprot
    subject: GO
    im_class: GOTerm
    status: sure
    basis: knowledge+java:UniProtConverter
    note: object IRI obo:GO_nnnnnnn -> GOTerm.identifier "GO:nnnnnnn"
  - source: uniprot
    subject: Keyword
    im_class: OntologyTerm
    status: guess
    basis: knowledge
    note: UniProt keyword IRI keywords:NNN; Protein.keywords is an OntologyTerm collection (uniprot-keywords source loads names)
  - source: uniprot
    subject: Citation
    im_class: Publication
    status: sure
    basis: java:UniProtConverter
    note: foaf:primaryTopicOf pubmed:NNN gives Publication.pubMedId
  - source: uniprot
    subject: SimpleSequence
    im_class: Sequence
    status: guess
    basis: knowledge
    note: rdf:value -> Sequence.residues; core:mass -> Protein.molecularWeight (term)
  - source: uniprot
    subject: RecommendedNameNode
    im_class: Protein
    status: sure
    basis: java:UniProtConverter
    note: flattened - core:fullName -> Protein.name
  - source: uniprot
    subject: SubmittedNameNode
    im_class: Protein
    status: guess
    basis: knowledge
    note: unreviewed entries have a submitted name instead of a recommended name
  - source: uniprot
    subject: AlternativeNameNode
    im_class: Synonym
    status: guess
    basis: knowledge
    note: alternative full names -> Synonym.value on the Protein
  - source: uniprot
    subject: DbResource
    im_class: CrossReference
    status: guess
    basis: knowledge
    note: rdfs:seeAlso IRIs -> CrossReference.identifier; DataSource from core:database
  # --- reactome (ReactomeConverter reads BioPAX: Pathway identifier/name, Protein primaryAccession) ---
  - type: biopax:Pathway
    im_class: Pathway
    status: sure
    basis: term+java:ReactomeConverter
  - type: biopax:BioSource
    im_class: Organism
    status: sure
    basis: java:ReactomeConverter
    note: converter parses the BioSource name into Organism
  - type: biopax:UnificationXref
    im_class: Pathway
    status: guess
    basis: knowledge
    note: UnificationXref with db Reactome carries the stable id R-HSA-nnn -> Pathway.identifier
  - type: biopax:PublicationXref
    im_class: Publication
    status: guess
    basis: knowledge
  - type: biopax:Protein
    im_class: Protein
    status: guess
    basis: java:ReactomeConverter
    note: converter takes the UniProt accession from the entity reference xref
  - type: biopax:ProteinReference
    im_class: Protein
    status: guess
    basis: knowledge
  - type: biopax:BiochemicalReaction
    im_class: PathwayReaction
    status: guess
    basis: spec-section-8
    note: new class proposed in the specification (Reactome Phase 1)
  # --- gwas catalog (HugeGwasConverter) ---
  - type: gwas:Association
    im_class: GWASResult
    status: sure
    basis: term+java:HugeGwasConverter
  - type: gwas:Study
    im_class: GWAS
    status: sure
    basis: term+java:HugeGwasConverter
  # --- clinvar (ClinvarConverter creates Allele, Gene, Disease) ---
  - type: cvo:VariationArchiveType
    im_class: Allele
    status: sure
    basis: java:ClinvarConverter
  - type: cvo:Gene
    im_class: Gene
    status: sure
    basis: java:ClinvarConverter
  - type: med2rdf:Disease
    im_class: Disease
    status: sure
    basis: java:ClinvarConverter
  # --- homologene (HomologeneConverter) ---
  - type: orth:OrthologsCluster
    im_class: Homologue
    status: guess
    basis: knowledge
    note: n-ary cluster; Homologue is pairwise - needs the all-pairs transform (spec D7)
  - type: orth:Gene
    im_class: Gene
    status: sure
    basis: java:HomologeneConverter
  - type: taxon:Taxon
    im_class: Organism
    status: sure
    basis: knowledge
  - type: orth:Protein
    im_class: Protein
    status: guess
    basis: knowledge
  # --- pubmed ---
  - source: pubmed
    subject: Pubmed
    im_class: Publication
    status: sure
    basis: knowledge
  - type: foaf:Person
    im_class: Author
    status: sure
    basis: term
  # --- mesh (HumanMine MeshTerm has only `name`; identifier is proposed in curation/extensions_additions.xml) ---
  - source: mesh
    subject: Descriptor
    im_class: MeshTerm
    status: sure
    basis: knowledge
    note: MeSH topical descriptors (D-ids) are what PubMed indexing and HumanMine's MeshTerm use
  # --- ensembl ---
  - type: terms:EnsemblGene
    im_class: Gene
    status: sure
    basis: knowledge
  - type: terms:EnsemblTranscript
    im_class: Transcript
    status: sure
    basis: knowledge
  - type: terms:EnsemblProtein
    im_class: Protein
    status: guess
    basis: knowledge
    note: ENSP ids are not UniProt accessions - decide whether Protein.secondaryIdentifier or drop
  - type: obo:SO_0000147
    im_class: Exon
    status: sure
    basis: term
  # generic fallbacks
  - type: owl:Class
    im_class: OntologyTerm
    status: guess
    basis: knowledge
    note: bare owl:Class subject in a non-ontology source; pick the concrete *Term class

# --------------------------------------------------------------------------- predicates
  # ---------------------------------------------------------------------------------------
  # Subjects resolved in the first curation pass (CURATION_GUIDE 4.1), 2026-09-16.
  # Every one is `role: skip`: none has an InterMine target.  `sure` means the evidence is in
  # the model, a stock converter or a spec decision - the note says which - not my taste.
  # A role set in out/<source>/mapping_subjects.tsv still overrides these.
  # ---------------------------------------------------------------------------------------

  # ensembl: both are unreachable from the Gene root, so they could not contribute rows even if
  # bound; loading transcripts or exons would mean adding a Transcript root, not binding these.
  - source: ensembl
    subject: EnsemblTranscriptFlagComment
    role: skip
    status: sure
    basis: structure:unreachable
    note: "rdf:Statement reifying a transcript flag (e.g. tsl1); transcript-level and unreachable from the Gene root"
  - source: ensembl
    subject: EnsemblOrderedExon
    role: skip
    status: sure
    basis: structure:unreachable
    note: "SIO_001261 ordered exon; exon-level and unreachable from the Gene root"

  # expressionatlas: the experiment -> assay -> expression hierarchy is spec D10, not started.
  # Deferred, not rejected.  See sources.yaml: until D10 lands this source must NOT replace
  # atlas-express, which it would otherwise silently delete.
  - {source: expressionatlas, subject: DifferentialAnalysis,   role: skip, status: sure, basis: spec-D10, note: "deferred to D10 (EBI hierarchy flattening)"}
  - {source: expressionatlas, subject: BaselineAnalysis,       role: skip, status: sure, basis: spec-D10, note: "deferred to D10 (EBI hierarchy flattening)"}
  - {source: expressionatlas, subject: Assay,                  role: skip, status: sure, basis: spec-D10, note: "deferred to D10 (EBI hierarchy flattening)"}
  - {source: expressionatlas, subject: Factor,                 role: skip, status: sure, basis: spec-D10, note: "deferred to D10 (EBI hierarchy flattening)"}
  - {source: expressionatlas, subject: DifferentialExpression, role: skip, status: sure, basis: spec-D10, note: "deferred to D10; would map onto AtlasExpression once flattened"}
  - {source: expressionatlas, subject: BaselineExpression,     role: skip, status: sure, basis: spec-D10, note: "deferred to D10; would map onto AtlasExpression once flattened"}
  - {source: expressionatlas, subject: Sample,                 role: skip, status: sure, basis: spec-D10, note: "deferred to D10 (EBI hierarchy flattening)"}

  # homologene: every items file already gets one DataSet, built from sources.yaml's
  # data_set_title by items.py; binding orth:OrthologyDataset would create a second one.
  - source: homologene
    subject: Dataset
    role: skip
    status: sure
    basis: code:items.py
    note: "items.py emits the source's DataSet from sources.yaml; binding this would duplicate it"

  # mesh: the live MeshTerm is `name` + `publications` (rdfc2im adds `identifier`).  There is no
  # field or class for MeSH's concept/term structure, qualifiers, tree numbers, or its other
  # record types, so the loadable part of a Descriptor is its label and id - already mapped.
  - {source: mesh, subject: Concept,       role: skip, status: sure, basis: model:MeshTerm, note: "no InterMine class for MeSH concepts"}
  - {source: mesh, subject: Term,          role: skip, status: sure, basis: model:MeshTerm, note: "no synonyms/terms field on MeshTerm; the preferred label is already MeshTerm.name"}
  - {source: mesh, subject: Qualifier,     role: skip, status: sure, basis: model:MeshTerm, note: "no InterMine class for MeSH qualifiers (subheadings)"}
  - {source: mesh, subject: TreeNumber,    role: skip, status: sure, basis: model:MeshTerm, note: "no field for MeSH tree numbers; MeshTerm is flat"}
  - {source: mesh, subject: PublicationType, role: skip, status: sure, basis: model:MeshTerm, note: "a different MeSH record type, reached via seeAlso; not a Descriptor"}
  - {source: mesh, subject: CheckTag,      role: skip, status: sure, basis: model:MeshTerm, note: "a different MeSH record type; unreachable from Descriptor"}
  - {source: mesh, subject: Geographic,    role: skip, status: sure, basis: model:MeshTerm, note: "a different MeSH record type; unreachable from Descriptor"}
  - {source: mesh, subject: Chemical,      role: skip, status: sure, basis: model:MeshTerm, note: "supplementary concept record, not a Descriptor; unreachable"}
  - {source: mesh, subject: Protocol,      role: skip, status: sure, basis: model:MeshTerm, note: "supplementary concept record, not a Descriptor; unreachable"}
  - {source: mesh, subject: AllowedDescriptorQualifierPair,    role: skip, status: sure, basis: model:MeshTerm, note: "descriptor/qualifier pairing; no model class; unreachable"}
  - {source: mesh, subject: DisallowedDescriptorQualifierPair, role: skip, status: sure, basis: model:MeshTerm, note: "descriptor/qualifier pairing; no model class; unreachable"}

  # reactome: Pathway is not a BioEntity, and CrossReference.subject must be one, so a
  # biopax RelationshipXref on a pathway has nowhere to attach.
  - source: reactome
    subject: RelationshipXref
    role: skip
    status: sure
    basis: model:Pathway
    note: "Pathway has no crossReferences and is not a BioEntity, so CrossReference.subject cannot point at it"

predicates:
  # ======================= gene identity: ncbigene (NcbiGeneConverter, taxon 9606) ==========
  - source: ncbigene
    pred: dct:identifier
    class: Gene
    im: Gene.primaryIdentifier
    status: sure
    basis: java:NcbiGeneConverter
    note: no 9606.xref in ncbigene_config.properties, so primaryIdentifier = the NCBI Gene id
  - source: ncbigene
    pred: rdfs:label
    class: Gene
    im: Gene.symbol
    status: sure
    basis: java:NcbiGeneConverter
    note: converter sets symbol from the official symbol (the rdfs:label here); term-URI would say name
  - source: ncbigene
    pred: insdc:standard_name
    class: Gene
    im: Gene.symbol
    status: drop
    basis: knowledge
    note: duplicates rdfs:label
  - source: ncbigene
    pred: ncbio:fullName
    class: Gene
    im: Gene.name
    status: sure
    basis: java:NcbiGeneConverter
  - source: ncbigene
    pred: dct:description
    class: Gene
    im: Gene.description
    status: sure
    basis: term
    note: same text as fullName in NCBI gene_info; keep both or drop one
  - source: ncbigene
    pred: insdc:gene_synonym
    class: Gene
    im: Synonym.value
    status: sure
    basis: java:NcbiGeneConverter
    note: converter createSynonym for every synonym
  - source: ncbigene
    pred: dct:alternative
    class: Gene
    im: Synonym.value
    status: sure
    basis: java:NcbiGeneConverter
    note: the Other_designations column -> synonyms
  - source: ncbigene
    pred: insdc:dblink
    class: Gene
    im: Gene.secondaryIdentifier
    status: sure
    basis: java:NcbiGeneConverter
    transform: iri_localname
    filter: "regex:/ensembl/|ENSG"
    table: main_dblink
    note: converter sets secondaryIdentifier = Ensembl id; the same dblink predicate also carries HGNC/MIM - filter keeps Ensembl only
  - source: ncbigene
    pred: insdc:db_xref
    class: Gene
    im: CrossReference.identifier
    status: sure
    basis: java:NcbiGeneConverter
    note: converter createCrossReference for every dbXref
  - source: ncbigene
    pred: ncbio:typeOfGene
    class: Gene
    im: Gene.typeOfGene
    status: guess
    basis: spec-section-8
    note: new attribute approved in spec section 8 (D1 side-stepped - carried by humanmine-delimited_additions.xml)
  - source: ncbigene
    pred: insdc:map
    class: Gene
    im: Gene.cytoLocation
    status: sure
    basis: java:NcbiGeneConverter
  - source: ncbigene
    pred: insdc:chromosome
    class: Gene
    im: Chromosome.primaryIdentifier
    status: guess
    basis: knowledge
    note: value like 1 or X -> Chromosome.primaryIdentifier; HumanMine chromosomes are keyed by primaryIdentifier+organism so include the Organism column in this table
  - source: ncbigene
    pred: ncbio:taxid
    class: Gene
    im: Organism.taxonId
    status: sure
    basis: java:NcbiGeneConverter
    transform: iri_localname
    value: taxid:9606
    required: "yes"
    note: fixed to human (project.xml organisms=9606)
  - source: ncbigene
    pred: dct:modified
    class: Gene
    im: ""
    status: todo
    basis: spec-D1
    note: spec D1 - no InterMine field for record modification date; drop or add
  - source: ncbigene
    pred: ncbio:nomenclatureStatus
    class: Gene
    im: ""
    status: todo
    basis: knowledge
    note: no InterMine field; probably drop
  - source: ncbigene
    pred: ncbio:featureType
    class: Gene
    im: ""
    status: todo
    basis: knowledge
    note: could feed Gene.sequenceOntologyTerm (SOTerm.name) - decide
  - source: ncbigene
    pred: insdc:locus_tag
    class: Gene
    im: ""
    status: todo
    basis: knowledge
    note: empty for human genes; drop

  # ======================= gene identity: hgnc (HgncConverter) =============================
  - source: hgnc
    subject: NCBIGene
    pred: dct:identifier
    im: Gene.primaryIdentifier
    status: sure
    basis: java:HgncConverter
    required: "yes"
    note: line[18] entrez id is the Gene key; HgncConverter skips rows without one
  - source: hgnc
    subject: Ensembl
    pred: dct:identifier
    im: Gene.secondaryIdentifier
    status: sure
    basis: java:HgncConverter
  - source: hgnc
    subject: HGNC
    pred: rdfs:label
    im: Gene.symbol
    status: sure
    basis: java:HgncConverter
  - source: hgnc
    subject: HGNC
    pred: dct:identifier
    im: Synonym.value
    status: sure
    basis: java:HgncConverter
    transform: "prefix:HGNC:"
    note: converter createSynonym(hgncId); rdf value is the bare number, HGNC file has "HGNC:11998"
  - source: hgnc
    subject: HGNC
    pred: dct:description
    im: Gene.name
    status: guess
    basis: knowledge
    note: "e.g. tumor protein p53 - the approved name; HgncConverter does not set name (ncbi-gene does)"
  - source: hgnc
    subject: HGNC
    pred: obo:so_part_of
    im: Gene.cytoLocation
    status: guess
    basis: knowledge
    note: "e.g. 17p13.1 cytoband; ncbi-gene also writes cytoLocation - genomic_priorities decides"
  - source: hgnc
    subject: HGNC
    pred: skos:altLabel
    im: Synonym.value
    status: sure
    basis: java:HgncConverter
    note: alias symbols/names -> Synonym
  - source: hgnc
    subject: UniProt
    pred: dct:identifier
    im: Protein.primaryAccession
    status: guess
    basis: knowledge
  - source: hgnc
    subject: PubMed
    pred: dct:identifier
    im: Publication.pubMedId
    status: sure
    basis: knowledge
  - source: hgnc
    subject: OMIM
    pred: dct:identifier
    im: Disease.primaryIdentifier
    status: guess
    basis: knowledge
    transform: "prefix:OMIM:"

  - source: hgnc
    subject: ENA
    pred: dct:identifier
    im: CrossReference.identifier
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    const: {DataSource.name: "ENA"}
  - source: hgnc
    subject: INSDC
    pred: dct:identifier
    im: CrossReference.identifier
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    const: {DataSource.name: "INSDC"}
  - source: hgnc
    subject: RefSeq
    pred: dct:identifier
    im: CrossReference.identifier
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    const: {DataSource.name: "RefSeq"}
  - source: hgnc
    subject: CCDS
    pred: dct:identifier
    im: CrossReference.identifier
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    const: {DataSource.name: "CCDS"}
  - source: hgnc
    subject: MGI
    pred: dct:identifier
    im: CrossReference.identifier
    status: guess
    basis: knowledge+java:NcbiGeneConverter
    const: {DataSource.name: "MGI"}
