  - source: pubmed
    pred: fabio:hasSubjectTerm
    column: mesh_topicaldescriptor_1
    class: Publication
    im: MeshTerm.identifier
    status: guess
    basis: knowledge
    table: main_mesh_subject_term
    transform: "iri_localname,regex:^(D[0-9]+)"
    note: >-
      The one column for fabio:hasSubjectTerm.  rdf-config's model.yaml lists four example values
      under this single predicate - a descriptor/qualifier pair, a geographic term, a check tag and
      a topical term - to illustrate the shapes a value can take, not four properties.  Read as four
      columns they became four untyped `OPTIONAL { ?Pubmed fabio:hasSubjectTerm ?x }` patterns in
