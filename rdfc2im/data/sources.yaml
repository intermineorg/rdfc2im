# Per-source settings for the rdf-config sources in scope.
#
#   replaces:  project.xml <source name=...> entries that the rdf-config load supersedes
#              (moved to replaced_sources.xml by `rdfc2im project`); [] = adds data, replaces nothing
#   alongside: stock sources this one supplements rather than replaces.  It loads right after them,
#              merges into their objects through the integration keys, and genomic_priorities
#              lists the stock source first for every field it writes, so existing values stand.
#              Use it when the stock source loads things this one cannot (replaced_coverage).
#   accepted_gaps: what a replaced source declares that this one never writes, and why that is
#              not a loss ({Class.field or Class: {basis, reason}}).  `check` fails on any other gap.
#   consts:    constant columns appended to every table of the source (Class.field: value)
#   roots:     which model.yaml subjects start a table set (default: the first subject)
#   data_source_name / data_set_title: what the delimited loader writes into DataSource/DataSet
#   types:     which nodes get an `a <type>` triple in the generated SPARQL: root | union | all
#   distinct:  add DISTINCT to the SELECT (default true)
#   scope:     good | structural | blocked  (spec section 8 achievability class)
#   gene_scope_field: the Gene.<field> `--genes` restricts this source by (scope.py
#              apply_gene_scope) - must be a field this source maps with required=yes, so the
#              restriction reaches every table, not just the one that happens to carry a label.
#              Only meaningful together with a resolver that turns a gene symbol into this
#              source's own scheme (see scope.py's resolve_ncbigene_symbols for the reference
#              one); a source with no resolver wired up is skipped, same as an unsupported
#              --taxon, rather than silently ignoring the restriction.

ncbigene:
  replaces: [ncbi-gene]
  data_source_name: NCBI
  data_source_url: https://rdfportal.org/dataset/ncbigene
  data_set_title: NCBI Gene (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: primaryIdentifier
  # STATUS.md D14: 255 Ensembl gene ids in NCBI's own cross-reference data are each shared by
  # two or more distinct NCBI Entrez records (overlapping-transcript/antisense annotations, e.g.
  # ENSG00000248767 <- both FOXL3-OT1 and FOXL3) - real upstream ambiguity, not an rdfc2im bug,
  # but it makes Gene.secondaryIdentifier non-unique, which key_secondaryidentifier_org assumes.
  key_ambiguity:
    Gene: {field: secondaryIdentifier, prefer_field: typeOfGene, prefer_value: protein-coding}
  scope: good
hgnc:
  replaces: [hgnc]
  data_source_name: HGNC
  data_source_url: https://rdfportal.org/dataset/hgnc
  data_set_title: HGNC identifiers (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: primaryIdentifier
  scope: good
uniprot:
  # Alongside, not a replacement: stock uniprot loads features, comments, isoforms, components and
  # canonical-protein links that these queries do not.  Both key Protein on primaryAccession.
  replaces: []
  alongside: [uniprot]
  data_source_name: UniProt
  # UniProt's own native SPARQL endpoint (sparql.uniprot.org), not RDF Portal - see the
  # Endpoint: comment in out/uniprot/queries/*.sparql - so the provenance link is UniProt's own
  # site, not an RDF Portal dataset page.
  data_source_url: https://www.uniprot.org/
  # Not "Swiss-Prot": these queries do not filter on up:reviewed, so they return TrEMBL too
  # (20,431 reviewed vs 190,278 unreviewed human entries), which matches stock HumanMine - see
  # core:reviewed in knowledge.yaml.  Stock names two datasets, "Swiss-Prot data set" and
  # "TrEMBL data set", by input file; one query cannot, so the title says what it holds.
  data_set_title: UniProtKB, Swiss-Prot and TrEMBL (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: symbol
  scope: good
go:
  replaces: [go]
  data_source_name: GO
  # GO's own project site, not RDF Portal - confirmed live rdfportal.org has no /dataset/go
  # landing page (its own graph is under /ontology/go, which 404s as a page, unlike the other
  # RDF-Portal-hosted sources here).
  data_source_url: https://geneontology.org/
  data_set_title: GO (RDF Portal)
  consts: {Ontology.name: GO}
  scope: good
hpo:
  replaces: [hpo]
  data_source_name: HPO
  data_set_title: Human Phenotype Ontology (RDF Portal)
  consts: {Ontology.name: Human Phenotype Ontology}
  scope: good
mp:
  replaces: [mammalian-phenotype-ontology]
  data_source_name: MGI
  data_set_title: Mammalian Phenotype Ontology (RDF Portal)
  consts: {Ontology.name: Mammalian Phenotype Ontology}
  scope: good
uberon:
  replaces: []
  data_source_name: Uberon
  data_set_title: Uber Anatomy Ontology (RDF Portal)
  consts: {Ontology.name: Uber Anatomy Ontology}
  scope: good
  note: activation only - not in HumanMine's project.xml; needs /uberon/ in the allow list
reactome:
  # Alongside, not a replacement: stock reactome's whole value is Pathway.proteins/genes and their
  # reverses, which this source never writes.  Pathway merges on identifier (R-HSA-... in both);
  # this source adds descriptions.
  replaces: []
  alongside: [reactome]
  data_source_name: Reactome
  data_source_url: https://rdfportal.org/dataset/reactome
  data_set_title: Reactome pathways (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  scope: good
gwascatalog:
  replaces: [huge-gwas]
  data_source_name: GWAS Catalog
  # Fetched via TogoVar's own SPARQL endpoint, not RDF Portal - see the Endpoint: comment in
  # out/gwascatalog/queries/*.sparql - so the provenance link is TogoVar's own site.
  data_source_url: https://togovar.org/
  data_set_title: GWAS Catalog (TogoVar)
  # No source-level Organism constant: nothing on the root, GWASResult, can hold an organism, so it
  # loaded unlinked.  The organism is declared where it belongs - SNP.organism and Gene.organism -
  # on the terms:snps and terms:mapped_genes entries in knowledge.yaml.
  accepted_gaps:
    GWAS.firstAuthor:
      basis: data:togovar
      reason: >-
        Not in the RDF: no gwas:Study or gwas:Association at grch38.togovar.org has an author
        predicate (every Study predicate, and those of a 2,000-association sample, listed
        2026-09-17).  The first author stays reachable as GWAS.publication.firstAuthor, which
        update-publications (loadFullRecord) fills.
    GWASResult.source:
      basis: java:HugeGwasConverter
      reason: declared in huge-gwas_additions.xml, never set by the converter
    Source:
      basis: java:HugeGwasConverter
      reason: declared in huge-gwas_additions.xml, never created by the converter
  gene_scope_field: secondaryIdentifier
  scope: good
clinvar:
  replaces: [clinvar]
  data_source_name: ClinVar
  data_source_url: https://rdfportal.org/dataset/clinvar
  data_set_title: ClinVar (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: primaryIdentifier
  scope: good
pubmed:
  replaces: []
  data_source_name: PubMed
  data_source_url: https://rdfportal.org/dataset/pubmed
  data_set_title: PubMed (RDF Portal)
  scope: good
  pmid_scope_field: identifier
  note: HumanMine fills Publication via update-publications; this would pre-load details for cited papers
homologene:
  replaces: []
  data_source_name: HomoloGene
  data_set_title: HomoloGene (RDF Portal)
  scope: structural
  note: not in project.xml (panther is); needs the cluster->pairwise transform (D7)
expressionatlas:
  # NOT [atlas-express] until spec D10 lands.  This source currently loads only DataSet name and
  # description; the stock atlas-express loads every AtlasExpression (type, condition,
  # expression, gene) and declares that class.  Replacing it would silently delete HumanMine's
  # expression data and remove AtlasExpression from the model.  Restore the replacement once the
  # experiment -> assay -> expression hierarchy maps onto AtlasExpression.
  replaces: []
  data_source_name: Expression Atlas
  data_set_title: Expression Atlas (RDF Portal)
  scope: structural
ensembl:
  replaces: []
  data_source_name: Ensembl
  data_source_url: https://rdfportal.org/dataset/ensembl
  data_set_title: Ensembl genes (RDF Portal)
  consts: {Organism.taxonId: "9606"}
  gene_scope_field: secondaryIdentifier
  scope: good
  note: not a HumanMine source today; supplies Ensembl ids/biotypes/locations that ncbi-gene lacks
mesh:
  replaces: []
  data_source_name: MeSH
  data_set_title: MeSH descriptors (NLM)
  roots: [Descriptor]
  scope: good
  note: endpoint is NLM's (id.nlm.nih.gov), not RDF Portal; update-publications also creates MeshTerm by name
disgenet:
  replaces: [disgenet-disease-associations]
  scope: blocked
  note: empty rdf-config dir
