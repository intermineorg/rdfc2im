# rdfc2im workspace configuration (paths relative to this file's directory)
model_dirs: [in/intermine, in/humanmine-bio-sources]
live_model: in/humanmine_model.xml
project_xml: in/humanmine_project.xml
priorities: in/humanmine_priorities.properties   # HumanMine's own; project merges our sources in
config_root: in/config
out: out
# sources: [ncbigene, hgnc, uniprot, go, reactome]   # default: every scope good/structural source in sources.yaml
type: humanmine-items
source_version: "4.3.0"                   # humanmine-bio-sources' gradle project version;
                                         # goes on each <source> so the mine resolves our jar
src_data_dir: /micklem/data/rdfc2im      # where items/<source>.xml will live on the build machine
model_json: in/humanmine_model.json      # for `rdfc2im linkml` (optional)
include_guess: true
limit: 20                                # 0 = no LIMIT (full extracts)
types: root                              # root | union | all - where to emit `a <type>` triples
extra_allow: curation/extra_allow.txt
extensions: curation/extensions_additions.xml
# scope:                                  # build-scope restriction; unset = human only, no gene list
#   taxon: ["9606"]                       # NCBI taxon id(s); a source with no other species in its
                                           # own data (HGNC, ClinVar, GWAS Catalog) is skipped, not
                                           # mislabelled, when this is not ["9606"]. --taxon overrides.
# Gene-list restriction has no workspace-file key (it is rarely fixed across every run the way
# taxon is) - use `--genes SYM1,SYM2` or `--genes @path/to/list.txt` instead. Only sources
# declaring `gene_scope_field` in sources.yaml support it; see scope.py.
